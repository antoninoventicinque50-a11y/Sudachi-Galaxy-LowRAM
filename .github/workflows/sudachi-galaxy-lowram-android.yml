name: Sudachi Galaxy LowRAM Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sudachi-galaxy-lowram-android.yml'
      - '.gitmodules'
      - 'CMakeModules/DownloadExternals.cmake'
      - 'src/core/hle/kernel/k_process.cpp'
      - 'src/core/loader/nso.cpp'
jobs:
  build-android:
    name: Build Sudachi LowRAM APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: '-Xmx3g'
    steps:
      - name: Checkout Sudachi Galaxy LowRAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h .
      - name: Fetch exact submodule versions
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 2
          git submodule status
      - name: Restore complete vcpkg history
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git -C externals/vcpkg rev-parse --is-shallow-repository)" = "true" ]; then
            git -C externals/vcpkg fetch --unshallow --no-tags origin
          else
            git -C externals/vcpkg fetch --no-tags origin
          fi
          git -C externals/vcpkg cat-file -e 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6:versions/baseline.json'
          git -C externals/vcpkg cat-file -e '7d7bef305b7affebc6f3ccacd12874ebd4fbfc50^{tree}'
          git -C externals/vcpkg cat-file -e 'dfe9aa860f5a8317f341a21d317be1cf44e89f18^{tree}'
          echo 'vcpkg history and required objects verified'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android tools matching Sudachi
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'
          df -h .
      - name: Cache experimental APK signing key
        uses: actions/cache@v4
        with:
          path: src/android/sudachi/debug.keystore
          key: sudachi-galaxy-lowram-test-signing-v1
      - name: Prepare test signing key if missing
        run: |
          if [ ! -s src/android/sudachi/debug.keystore ]; then
            keytool -genkeypair -v -keystore src/android/sudachi/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install glslangValidator host tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          command -v glslangValidator
          glslangValidator --version
      - name: Build arm64 APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew :sudachi:assembleMainlineRelWithDebInfo --no-daemon --max-workers=2 --stacktrace
      - name: Upload Sudachi LowRAM APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudachi-Galaxy-LowRAM-Android
          path: src/android/sudachi/build/outputs/apk/mainline/relWithDebInfo/*.apk
          if-no-files-found: error
          retention-days: 7
